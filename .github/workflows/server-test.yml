name: Go Server Regression
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-test.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Unit, regression, and race tests
        working-directory: server
        run: go test -race -count=1 ./...
      - name: Static analysis
        working-directory: server
        run: go vet ./...
      - name: Linux build
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/familyguard-server .
