# Adjust domain and certificate paths. Place inside your existing nginx config,
# or use an existing TLS reverse proxy that forwards /v1/ and /healthz.
# DO NOT open port 8088 to the public Internet.
limit_req_zone $binary_remote_addr zone=familyguard_limit:10m rate=10r/s;
server {
    listen 443 ssl;
    server_name guard.example.com;
    ssl_certificate /etc/letsencrypt/live/guard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guard.example.com/privkey.pem;
    client_max_body_size 26m;

    location / {
        limit_req zone=familyguard_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }
}
